<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FIRLLI Portfolio</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>


    /* =========================
   PAGE TRANSITION
========================= */

.page-transition{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(0,229,255,.12),
      rgba(5,8,22,1) 60%
    );

  backdrop-filter:blur(20px);

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  z-index:99999;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .8s ease,
    visibility .8s ease;
}

.page-transition.active{
  opacity:1;
  visibility:visible;
}

.transition-glow{
  width:220px;
  height:220px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(0,229,255,.35),
      rgba(0,229,255,.08),
      transparent 70%
    );

  filter:blur(40px);

  animation:
    portalPulse 1.5s infinite ease-in-out;
}

.transition-text{
  margin-top:40px;

  letter-spacing:6px;

  font-size:13px;

  color:rgba(255,255,255,.7);

  animation:flicker 1.2s infinite;
}

@keyframes portalPulse{

  0%{
    transform:scale(.8);
    opacity:.5;
  }

  50%{
    transform:scale(1.2);
    opacity:1;
  }

  100%{
    transform:scale(.8);
    opacity:.5;
  }

}

@keyframes flicker{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.4;
  }

}

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#050816;
      --card:#0b1020;
      --text:#ffffff;
      --muted:#9ba3b4;
      --cyan:#00e5ff;
      --purple:#7a5cff;
    }

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:white;
      overflow:hidden;
    }

    /* =========================
       LOADER
    ========================== */

    .loader{
      position:fixed;
      inset:0;
      z-index:9999;

      background:
        radial-gradient(circle at top,
        rgba(0,229,255,.15),
        transparent 30%),

        radial-gradient(circle at bottom,
        rgba(122,92,255,.15),
        transparent 30%),

        #050816;

      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;

      animation:loaderOut 1s ease forwards;
      animation-delay:3s;
    }

    .loader-ring{
      width:130px;
      height:130px;
      border-radius:50%;

      border:2px solid rgba(255,255,255,.08);
      border-top:2px solid var(--cyan);

      animation:spin 1s linear infinite;

      position:relative;
    }

    .loader-ring::before{
      content:'';
      position:absolute;
      inset:-20px;
      border-radius:50%;

      border:1px solid rgba(0,229,255,.15);

      animation:pulse 2s infinite;
    }

    .loader-text{
      margin-top:30px;
      letter-spacing:6px;
      font-size:13px;
      color:rgba(255,255,255,.7);
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes pulse{
      0%{
        transform:scale(.8);
        opacity:1;
      }

      100%{
        transform:scale(1.3);
        opacity:0;
      }
    }

    @keyframes loaderOut{
      to{
        opacity:0;
        visibility:hidden;
      }
    }

    /* =========================
       BACKGROUND
    ========================== */

    .bg{
      position:fixed;
      inset:0;
      overflow:hidden;
      z-index:-1;
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      opacity:.35;
    }

    .orb1{
      width:400px;
      height:400px;
      background:#00e5ff;

      top:-100px;
      left:-100px;

      animation:float1 10s ease-in-out infinite;
    }

    .orb2{
      width:350px;
      height:350px;
      background:#7a5cff;

      bottom:-100px;
      right:-100px;

      animation:float2 12s ease-in-out infinite;
    }

    @keyframes float1{
      50%{
        transform:translateY(40px) translateX(20px);
      }
    }

    @keyframes float2{
      50%{
        transform:translateY(-40px) translateX(-20px);
      }
    }

    /* =========================
       HERO
    ========================== */

    .hero{
      width:100%;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:40px;
    }

    .hero-content{
      width:100%;
      max-width:1300px;

      display:grid;
      grid-template-columns:1fr 450px 1fr;
      align-items:center;
      gap:40px;
    }

    /* =========================
       LEFT
    ========================== */

    .left h1{
      font-size:72px;
      font-weight:800;
      line-height:1;

      margin-bottom:20px;

      background:linear-gradient(
        90deg,
        #ffffff,
        #00e5ff
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .role{
      font-size:15px;
      color:var(--muted);
      letter-spacing:4px;

      margin-bottom:30px;
    }

    .typing{
      font-size:24px;
      font-weight:600;

      min-height:40px;

      margin-bottom:40px;
    }

    .typing span{
      color:var(--cyan);
    }

    .buttons{
      display:flex;
      gap:20px;
      margin-bottom:50px;
    }

    .btn{
      padding:16px 28px;
      border-radius:14px;
      text-decoration:none;

      font-size:14px;
      font-weight:600;

      transition:.3s ease;
    }

    .btn-primary{
      background:linear-gradient(
        135deg,
        var(--cyan),
        #0077ff
      );

      color:black;
    }

    .btn-primary:hover{
      transform:translateY(-4px);
      box-shadow:0 10px 30px rgba(0,229,255,.25);
    }

    .btn-secondary{
      border:1px solid rgba(255,255,255,.1);
      color:white;
      background:rgba(255,255,255,.03);
      backdrop-filter:blur(20px);
    }

    .btn-secondary:hover{
      border-color:rgba(0,229,255,.4);
      transform:translateY(-4px);
    }

    /* =========================
       IMAGE
    ========================== */

    .image-wrapper{
      position:relative;
      width:420px;
      margin:auto;
    }

    .image{
      width:100%;
      display:block;
      user-select:none;
      pointer-events:none;
      border-radius:30px;
    }

    .robot-layer{
      position:absolute;
      inset:0;

      mask-image: radial-gradient(
        circle at center,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,0.9) 25%,
        rgba(0,0,0,0.5) 45%,
        transparent 70%
      );

      -webkit-mask-image: radial-gradient(
        circle at center,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,0.9) 25%,
        rgba(0,0,0,0.5) 45%,
        transparent 70%
      );

      mask-repeat:no-repeat;
      -webkit-mask-repeat:no-repeat;

      mask-size:0px 0px;
      -webkit-mask-size:0px 0px;

      mask-position:center;
      -webkit-mask-position:center;

      filter:
        saturate(1.15)
        contrast(1.1)
        drop-shadow(0 0 25px rgba(0,229,255,.3));
    }

    .glow{
      position:absolute;
      width:320px;
      height:320px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(0,229,255,.18),
          transparent 70%
        );

      filter:blur(40px);

      pointer-events:none;

      transform:translate(-50%,-50%);
      opacity:0;
    }

    .cursor{
      position:absolute;
      width:24px;
      height:24px;
      border-radius:50%;

      border:1px solid rgba(255,255,255,.8);

      transform:translate(-50%,-50%);

      pointer-events:none;
      z-index:10;
    }

    /* =========================
       STATS
    ========================== */

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .stat{
      padding:24px;
      border-radius:24px;

      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.05);

      backdrop-filter:blur(20px);

      transition:.3s ease;
    }

    .stat:hover{
      transform:translateY(-6px);
      border-color:rgba(0,229,255,.3);
    }

    .stat h2{
      font-size:34px;
      color:var(--cyan);

      margin-bottom:10px;
    }

    .stat p{
      color:var(--muted);
      font-size:14px;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:1100px){

      body{
        overflow:auto;
      }

      .hero{
        height:auto;
        padding:120px 30px;
      }

      .hero-content{
        grid-template-columns:1fr;
      }

      .left{
        text-align:center;
      }

      .buttons{
        justify-content:center;
      }

      .stats{
        margin-top:40px;
      }

      .image-wrapper{
        order:-1;
      }

    }

  </style>
</head>
<body>

  <!-- LOADER -->
  <div class="loader">

    <div class="loader-ring"></div>

    <div class="loader-text">
      INITIALIZING AURA
    </div>

  </div>

  <!-- BACKGROUND -->
  <div class="bg">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

  </div>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <!-- LEFT -->
      <div class="left">

        <div class="role">
          IT DEVELOPER | FULL STACK DEVELOPER
        </div>

        <h1>FIRLLI</h1>

        <div class="typing">
          > <span id="typing-text"></span>
        </div>

        <div class="buttons">

          <a href="index.html" class="btn btn-primary" id="portfolioBtn">
  LIHAT KARYA
</a>

          <a href="#" class="btn btn-secondary">
            KONTAK SAYA
          </a>

        </div>

      </div>

      <!-- IMAGE -->
      <div class="image-wrapper" id="container">

        <img src="asli.png" class="image">

        <img
          src="robot6.png"
          class="image robot-layer"
          id="robot"
        >

        <div class="glow" id="glow"></div>

        <div class="cursor" id="cursor"></div>

      </div>

      <!-- RIGHT -->
      <div class="stats">

        <div class="stat">
          <h2>7+</h2>
          <p>TAHUN EXP</p>
        </div>

        <div class="stat">
          <h2>10+</h2>
          <p>PROJECTS</p>
        </div>

        <div class="stat">
          <h2>200+</h2>
          <p>USERS</p>
        </div>

        <div class="stat">
          <h2>30+</h2>
          <p>API ENDPOINT</p>
        </div>

      </div>

    </div>

    <div class="page-transition" id="transition">

  <div class="transition-glow"></div>

  <div class="transition-text">
    OPENING PORTFOLIO
  </div>
  </div>

  </section>

  <script>

    // =========================
    // TYPING EFFECT
    // =========================

    const text = [
      "Mobile Developer",
      "Frontend Engineer",
      "Backend Engineer",
      "UI Interaction Designer"
    ];

    let index = 0;
    let char = 0;

    const typingText =
      document.getElementById("typing-text");

    function type(){

      if(char < text[index].length){

        typingText.innerHTML +=
          text[index].charAt(char);

        char++;

        setTimeout(type, 80);

      }else{

        setTimeout(erase, 1800);

      }

    }

    function erase(){

      if(char > 0){

        typingText.innerHTML =
          text[index].substring(0, char - 1);

        char--;

        setTimeout(erase, 40);

      }else{

        index++;

        if(index >= text.length){
          index = 0;
        }

        setTimeout(type, 400);

      }

    }

    type();

    // =========================
    // IMAGE HOVER
    // =========================

    const container =
      document.getElementById("container");

    const robot =
      document.getElementById("robot");

    const glow =
      document.getElementById("glow");

    const cursor =
      document.getElementById("cursor");

    let mouseX = 0;
    let mouseY = 0;

    let currentX = 0;
    let currentY = 0;

    function animate(){

      currentX +=
        (mouseX - currentX) * 0.1;

      currentY +=
        (mouseY - currentY) * 0.1;

      robot.style.webkitMaskPosition =
        `${currentX - 140}px ${currentY - 140}px`;

      robot.style.maskPosition =
        `${currentX - 140}px ${currentY - 140}px`;

      glow.style.left = `${currentX}px`;
      glow.style.top = `${currentY}px`;

      cursor.style.left = `${currentX}px`;
      cursor.style.top = `${currentY}px`;

      requestAnimationFrame(animate);

    }

    animate();

    container.addEventListener("mousemove",(e)=>{

      const rect =
        container.getBoundingClientRect();

      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;

      robot.style.webkitMaskSize =
        `280px 280px`;

      robot.style.maskSize =
        `280px 280px`;

      glow.style.opacity = 1;

    });

    container.addEventListener("mouseleave",()=>{

      robot.style.webkitMaskSize =
        `0px 0px`;

      robot.style.maskSize =
        `0px 0px`;

      glow.style.opacity = 0;

    });



    // =========================
// PAGE TRANSITION
// =========================

const portfolioBtn =
  document.getElementById("portfolioBtn");

const transition =
  document.getElementById("transition");

portfolioBtn.addEventListener("click",(e)=>{

  e.preventDefault();

  transition.classList.add("active");

  // optional smooth zoom
  document.body.style.transition =
    "transform 1s ease, opacity 1s ease";

  document.body.style.transform =
    "scale(1.03)";

  document.body.style.opacity =
    "0.7";

  setTimeout(()=>{

    window.location.href = "index4.html";

  },1400);

});

  </script>


</body>
</html>
